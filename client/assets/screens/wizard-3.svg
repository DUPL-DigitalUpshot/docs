<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Connect a platform">
<title>Connect a platform</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="960" height="500" fill="var(--app)"/>
<g transform="translate(906,4)"><rect x="0" y="0" width="50" height="20" rx="10" fill="var(--okbg)"/><text x="9" y="14.5" class="sm" text-anchor="start" style="fill:var(--ok)">Built</text></g><rect x="0" y="30" width="960" height="470" rx="12" class="card" /><rect x="0" y="30" width="152" height="470" rx="12" fill="var(--sidebar)"/><rect x="138" y="30" width="14" height="470" rx="0" fill="var(--sidebar)"/><text x="20" y="64" class="bb" text-anchor="start" style="fill:#ffffff">UniQCAI</text><text x="20" y="80" class="sm" text-anchor="start" style="fill:#97a2af">by Digital Upshot</text><text x="22" y="124" class="" text-anchor="start" style="fill:#97a2af">Overview</text><rect x="8" y="138" width="130" height="28" rx="6" fill="#262c35"/><rect x="8" y="138" width="3" height="28" rx="2" fill="#3d5ce8"/><text x="22" y="156" class="b" text-anchor="start" style="fill:#ffffff">Brands</text><text x="22" y="188" class="" text-anchor="start" style="fill:#97a2af">Runs</text><text x="22" y="220" class="" text-anchor="start" style="fill:#97a2af">Schedules</text><text x="22" y="252" class="" text-anchor="start" style="fill:#97a2af">Report library</text><text x="20" y="280" class="sm" text-anchor="start" style="fill:#6b7684">Setup</text><text x="22" y="310" class="" text-anchor="start" style="fill:#97a2af">Platform accounts</text><text x="22" y="342" class="" text-anchor="start" style="fill:#97a2af">Mailboxes</text><text x="22" y="374" class="" text-anchor="start" style="fill:#97a2af">Users &amp; access</text><text x="22" y="406" class="" text-anchor="start" style="fill:#97a2af">Settings</text><text x="22" y="438" class="" text-anchor="start" style="fill:#97a2af">Audit log</text><text x="176" y="68" class="h1" text-anchor="start">Connect a platform</text><line x1="152" y1="102" x2="960" y2="102" class="sep" /><circle cx="187" cy="137" r="11" fill="var(--ok)"/><path d="M183 138 l2.6 2.8 L191.5 134" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="142" class="sm" text-anchor="start" style="fill:var(--text)">Platform &amp; categories</text><line x1="330" y1="137" x2="350" y2="137" class="sep" stroke="var(--line2)"/><circle cx="371" cy="137" r="11" fill="var(--ok)"/><path d="M367 138 l2.6 2.8 L375.5 134" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="142" class="sm" text-anchor="start" style="fill:var(--text)">Login</text><line x1="409" y1="137" x2="429" y2="137" class="sep" stroke="var(--line2)"/><circle cx="450" cy="137" r="11" fill="var(--primary)"/><text x="450" y="142" class="sm b" text-anchor="middle" style="fill:#ffffff">3</text><text x="469" y="142" class="sm b" text-anchor="start" style="fill:var(--text)">Verification</text><line x1="534" y1="137" x2="554" y2="137" class="sep" stroke="var(--line2)"/><circle cx="575" cy="137" r="11" fill="var(--panel)"/><text x="575" y="142" class="sm b" text-anchor="middle" style="fill:var(--muted)">4</text><text x="594" y="142" class="sm" text-anchor="start" style="fill:var(--muted)">Reports &amp; test</text><text x="176" y="188" class="h2" text-anchor="start">Where do this login's sign-in codes arrive?</text><text x="176" y="214" class="sm" text-anchor="start">Verification inbox</text><rect x="176" y="220" width="340" height="30" rx="6" class="card" /><text x="188" y="239.5" class="sm" text-anchor="start">reports-inbox@yourcompany.com</text><text x="532" y="214" class="sm b" text-anchor="start">Direct inbox</text><text x="532" y="232" class="sm" text-anchor="start">The portal emails this address itself.</text><text x="532" y="250" class="sm" text-anchor="start">A forwarded inbox works too — you then</text><text x="532" y="268" class="sm" text-anchor="start">confirm which address it forwards for.</text><rect x="176" y="286" width="760" height="130" rx="8" class="sub" /><text x="192" y="312" class="b" text-anchor="start">Which message counts as the code</text><text x="192" y="332" class="sm" text-anchor="start">Supplied for each portal. You can change it, and test it before saving.</text><text x="192" y="360" class="sm" text-anchor="start">From</text><text x="246" y="360" class="mono" text-anchor="start">brands@blinkit.com</text><text x="426" y="360" class="sm" text-anchor="start">Subject contains</text><text x="534" y="360" class="mono" text-anchor="start">sign in</text><text x="192" y="384" class="sm" text-anchor="start">Code</text><text x="246" y="384" class="mono" text-anchor="start">a 6-digit number, or a one-time link</text><rect x="824" y="370" width="96" height="28" rx="8" class="card" /><text x="872.0" y="388" class="sm b" text-anchor="middle">Test rule</text><path d="M194 406 l2.6 2.8 L202.5 402" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="410" class="sm" text-anchor="start" style="fill:var(--ok)">Matched a message received 10:42 · code found</text><rect x="846" y="440" width="90" height="28" rx="8" fill="var(--primary)"/><text x="891.0" y="458" class="sm b" text-anchor="middle" style="fill:#ffffff">Continue</text><rect x="766" y="440" width="74" height="28" rx="8" class="card" /><text x="803.0" y="458" class="sm b" text-anchor="middle">Back</text>
</svg>
