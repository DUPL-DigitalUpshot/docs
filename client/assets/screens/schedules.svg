<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-label="Schedules">
<title>Schedules</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="960" height="550" fill="var(--app)"/>
<g transform="translate(906,4)"><rect x="0" y="0" width="50" height="20" rx="10" fill="var(--okbg)"/><text x="9" y="14.5" class="sm" text-anchor="start" style="fill:var(--ok)">Built</text></g><rect x="0" y="30" width="960" height="520" rx="12" class="card" /><rect x="0" y="30" width="152" height="520" rx="12" fill="var(--sidebar)"/><rect x="138" y="30" width="14" height="520" rx="0" fill="var(--sidebar)"/><text x="20" y="64" class="bb" text-anchor="start" style="fill:#ffffff">UniQCAI</text><text x="20" y="80" class="sm" text-anchor="start" style="fill:#97a2af">by Digital Upshot</text><text x="22" y="124" class="" text-anchor="start" style="fill:#97a2af">Overview</text><text x="22" y="156" class="" text-anchor="start" style="fill:#97a2af">Brands</text><text x="22" y="188" class="" text-anchor="start" style="fill:#97a2af">Runs</text><rect x="8" y="202" width="130" height="28" rx="6" fill="#262c35"/><rect x="8" y="202" width="3" height="28" rx="2" fill="#3d5ce8"/><text x="22" y="220" class="b" text-anchor="start" style="fill:#ffffff">Schedules</text><text x="22" y="252" class="" text-anchor="start" style="fill:#97a2af">Report library</text><text x="20" y="280" class="sm" text-anchor="start" style="fill:#6b7684">Setup</text><text x="22" y="310" class="" text-anchor="start" style="fill:#97a2af">Platform accounts</text><text x="22" y="342" class="" text-anchor="start" style="fill:#97a2af">Mailboxes</text><text x="22" y="374" class="" text-anchor="start" style="fill:#97a2af">Users &amp; access</text><text x="22" y="406" class="" text-anchor="start" style="fill:#97a2af">Settings</text><text x="22" y="438" class="" text-anchor="start" style="fill:#97a2af">Audit log</text><text x="176" y="68" class="h1" text-anchor="start">Schedules</text><rect x="830" y="50" width="106" height="30" rx="8" fill="var(--primary)"/><text x="883.0" y="70" class="b" text-anchor="middle" style="fill:#ffffff">New schedule</text><line x1="152" y1="102" x2="960" y2="102" class="sep" /><rect x="176" y="126" width="760" height="30" rx="6" fill="var(--panel)"/><text x="190" y="146" class="sm b" text-anchor="start">Name</text><text x="380" y="146" class="sm b" text-anchor="start">Brand</text><text x="530" y="146" class="sm b" text-anchor="start">When</text><text x="660" y="146" class="sm b" text-anchor="start">Dates it pulls</text><text x="936" y="146" class="sm b" text-anchor="end">Next run</text><text x="190" y="177.5" class="sm" text-anchor="start">Morning pull</text><text x="380" y="177.5" class="sm" text-anchor="start">Northwind Foods</text><text x="530" y="177.5" class="sm" text-anchor="start">Daily 06:00</text><text x="660" y="177.5" class="sm" text-anchor="start">Last 3 days</text><text x="936" y="177.5" class="sm" text-anchor="end">tomorrow 06:00</text><line x1="176" y1="190" x2="936" y2="190" class="sep" /><text x="190" y="211.5" class="sm" text-anchor="start">Weekly wrap</text><text x="380" y="211.5" class="sm" text-anchor="start">Bluepeak Drinks</text><text x="530" y="211.5" class="sm" text-anchor="start">Mon 07:00</text><text x="660" y="211.5" class="sm" text-anchor="start">Last 7 days</text><text x="936" y="211.5" class="sm" text-anchor="end">Mon 07:00</text><line x1="176" y1="224" x2="936" y2="224" class="sep" /><text x="190" y="245.5" class="sm" text-anchor="start">Month end</text><text x="380" y="245.5" class="sm" text-anchor="start">Saffron Kitchen</text><text x="530" y="245.5" class="sm" text-anchor="start">1st 08:00</text><text x="660" y="245.5" class="sm" text-anchor="start">Previous month</text><text x="936" y="245.5" class="sm" text-anchor="end">1 Oct 08:00</text><line x1="176" y1="258" x2="936" y2="258" class="sep" /><rect x="176" y="282" width="760" height="236" rx="8" class="card" /><text x="196" y="310" class="h2" text-anchor="start">Morning pull</text><text x="196" y="342" class="sm" text-anchor="start">How often</text><rect x="196" y="352" width="188" height="28" rx="8" class="sub" /><rect x="198" y="354" width="52" height="24" rx="6" fill="var(--bg)"/><text x="224.0" y="370" class="sm b" text-anchor="middle">Daily</text><text x="283.5" y="370" class="sm" text-anchor="middle">Weekly</text><text x="349.5" y="370" class="sm" text-anchor="middle">Monthly</text><text x="426" y="372" class="sm" text-anchor="start">at 06:00 India Standard Time</text><text x="196" y="410" class="sm" text-anchor="start">Which dates each run should pull</text><circle cx="203" cy="427" r="7" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="203" cy="427" r="3.5" fill="var(--primary)"/><text x="220" y="432" class="sm" text-anchor="start">A rolling window</text><rect x="346" y="416" width="120" height="26" rx="6" class="card" /><text x="358" y="434" class="sm" text-anchor="start">last 3 days</text><circle cx="493" cy="427" r="7" fill="var(--bg)" stroke="var(--line2)" stroke-width="1.5"/><text x="510" y="432" class="sm" text-anchor="start">Fixed dates</text><rect x="196" y="454" width="720" height="26" rx="6" fill="var(--soft)"/><text x="210" y="471" class="sm" text-anchor="start" style="fill:var(--primary)">Next runs: Tue 23 Sep 06:00 pulls 20–22 Sep  ·  Wed 24 Sep 06:00 pulls 21–23 Sep</text><text x="176" y="544" class="sm" text-anchor="start">The preview spells out the dates each run will ask for, which is where most scheduling mistakes show up.</text>
</svg>
