<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 366" width="1040" height="366" role="img" aria-label="Who does what: setup, automatic collection, and use">
<title>Who does what: setup, automatic collection, and use</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="1040" height="366" fill="var(--app)"/>
<text x="18" y="30" class="sm b" text-anchor="start" style="fill:var(--primary)">SET UP</text><text x="96" y="30" class="sm" text-anchor="start">us, once per brand</text><rect x="18" y="42" width="237" height="78" rx="8" class="card" /><text x="34" y="70" class="b" text-anchor="start">Add the brand</text><text x="34" y="92" class="sm" text-anchor="start">Its name, and who may see it.</text><path d="M258 81 L270 81" class="arw" marker-end="url(#a)"/><rect x="273" y="42" width="237" height="78" rx="8" class="card" /><text x="289" y="70" class="b" text-anchor="start">Connect the platform</text><text x="289" y="92" class="sm" text-anchor="start">One login, plus its code inbox.</text><path d="M513 81 L525 81" class="arw" marker-end="url(#a)"/><rect x="528" y="42" width="237" height="78" rx="8" class="card" /><text x="544" y="70" class="b" text-anchor="start">Pick the reports</text><text x="544" y="92" class="sm" text-anchor="start">Which exports matter to you.</text><path d="M768 81 L780 81" class="arw" marker-end="url(#a)"/><rect x="783" y="42" width="237" height="78" rx="8" class="card" /><text x="799" y="70" class="b" text-anchor="start">Set the timetable</text><text x="799" y="92" class="sm" text-anchor="start">Daily, weekly, or not at all.</text><path d="M520 126 L520 150" class="arw" marker-end="url(#a)"/><rect x="18" y="154" width="1004" height="62" rx="8" class="soft" /><text x="520" y="182" class="b" text-anchor="middle">UniQCAI signs in, checks it is on your business, and downloads</text><text x="520" y="202" class="sm" text-anchor="middle">with nobody at a keyboard</text><path d="M520 220 L520 244" class="arw" marker-end="url(#a)"/><text x="18" y="264" class="sm b" text-anchor="start" style="fill:var(--primary)">USE IT</text><text x="96" y="264" class="sm" text-anchor="start">your team, any day</text><rect x="18" y="276" width="322" height="78" rx="8" class="card" /><text x="34" y="304" class="b" text-anchor="start">Open your brand</text><text x="34" y="326" class="sm" text-anchor="start">Yours, and nothing else.</text><path d="M343 315 L356 315" class="arw" marker-end="url(#a)"/><rect x="359" y="276" width="322" height="78" rx="8" class="card" /><text x="375" y="304" class="b" text-anchor="start">See what is new</text><text x="375" y="326" class="sm" text-anchor="start">How fresh each platform is.</text><path d="M684 315 L697 315" class="arw" marker-end="url(#a)"/><rect x="700" y="276" width="322" height="78" rx="8" class="card" /><text x="716" y="304" class="b" text-anchor="start">Download what you need</text><text x="716" y="326" class="sm" text-anchor="start">One file, or the set as a zip.</text>
</svg>
