<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-label="Platform coverage by category">
<title>Platform coverage by category</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="760" height="348" fill="var(--app)"/>
<text x="18" y="30" class="h2" text-anchor="start">Where each platform stands today</text><rect x="18" y="46" width="724" height="284" rx="8" class="card" /><text x="38" y="78" class="sm b" text-anchor="start">Platform</text><text x="300" y="78" class="sm b" text-anchor="start">Ads</text><text x="510" y="78" class="sm b" text-anchor="start">Sales</text><line x1="18" y1="92" x2="742" y2="92" class="sep" /><rect x="38" y="103" width="62" height="22" rx="11" fill="var(--panel)"/><circle cx="49" cy="114" r="4" fill="#5b21b6"/><text x="59" y="118" class="sm" text-anchor="start" style="fill:var(--text)">Zepto</text><rect x="300" y="104" width="102" height="20" rx="10" fill="var(--okbg)"/><text x="309" y="118.5" class="sm" text-anchor="start" style="fill:var(--ok)">Working today</text><rect x="510" y="104" width="70" height="20" rx="10" fill="var(--infobg)"/><text x="519" y="118.5" class="sm" text-anchor="start" style="fill:var(--info)">In build</text><rect x="38" y="137" width="74" height="22" rx="11" fill="var(--panel)"/><circle cx="49" cy="148" r="4" fill="#f5c518"/><text x="59" y="152" class="sm" text-anchor="start" style="fill:var(--text)">Blinkit</text><rect x="300" y="138" width="76" height="20" rx="10" fill="var(--panel)"/><text x="309" y="152.5" class="sm" text-anchor="start" style="fill:var(--muted)">Scheduled</text><rect x="510" y="138" width="76" height="20" rx="10" fill="var(--panel)"/><text x="519" y="152.5" class="sm" text-anchor="start" style="fill:var(--muted)">Scheduled</text><rect x="38" y="171" width="132" height="22" rx="11" fill="var(--panel)"/><circle cx="49" cy="182" r="4" fill="#fc8019"/><text x="59" y="186" class="sm" text-anchor="start" style="fill:var(--text)">Swiggy Instamart</text><rect x="300" y="172" width="76" height="20" rx="10" fill="var(--panel)"/><text x="309" y="186.5" class="sm" text-anchor="start" style="fill:var(--muted)">Scheduled</text><rect x="510" y="172" width="76" height="20" rx="10" fill="var(--panel)"/><text x="519" y="186.5" class="sm" text-anchor="start" style="fill:var(--muted)">Scheduled</text><rect x="38" y="205" width="132" height="22" rx="11" fill="var(--panel)"/><circle cx="49" cy="216" r="4" fill="#2874f0"/><text x="59" y="220" class="sm" text-anchor="start" style="fill:var(--text)">Flipkart Minutes</text><rect x="300" y="206" width="76" height="20" rx="10" fill="var(--panel)"/><text x="309" y="220.5" class="sm" text-anchor="start" style="fill:var(--muted)">Scheduled</text><rect x="510" y="206" width="76" height="20" rx="10" fill="var(--panel)"/><text x="519" y="220.5" class="sm" text-anchor="start" style="fill:var(--muted)">Scheduled</text><rect x="38" y="239" width="87" height="22" rx="11" fill="var(--panel)"/><circle cx="49" cy="250" r="4" fill="#84c225"/><text x="59" y="254" class="sm" text-anchor="start" style="fill:var(--text)">BigBasket</text><rect x="300" y="240" width="63" height="20" rx="10" fill="var(--warnbg)"/><text x="309" y="254.5" class="sm" text-anchor="start" style="fill:var(--warn)">On hold</text><rect x="510" y="240" width="63" height="20" rx="10" fill="var(--warnbg)"/><text x="519" y="254.5" class="sm" text-anchor="start" style="fill:var(--warn)">On hold</text><line x1="18" y1="266" x2="742" y2="266" class="sep" /><text x="38" y="290" class="sm" text-anchor="start">BigBasket needs a Google sign-in with two-factor authentication. It is parked until</text><text x="38" y="308" class="sm" text-anchor="start">you decide whether to pursue it — see the decisions list at the end.</text>
</svg>
