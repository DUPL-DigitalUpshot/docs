="sm" text-anchor="start">enters logins, edits schedules, starts runs, downloads everything.</text><text x="196" y="408" class="sm b" text-anchor="start">Executive</text><text x="276" y="408" class="sm" text-anchor="start">sees and downloads reports. Starting a run is a separate tick you grant</text><text x="276" y="426" class="sm" text-anchor="start">per person, and it is off unless you turn it on.</text>
</svg>
