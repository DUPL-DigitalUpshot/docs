<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Connect a platform">
<title>Connect a platform</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="960" height="530" fill="var(--app)"/>
<g transform="translate(906,4)"><rect x="0" y="0" width="50" height="20" rx="10" fill="var(--okbg)"/><text x="9" y="14.5" class="sm" text-anchor="start" style="fill:var(--ok)">Built</text></g><rect x="0" y="30" width="960" height="500" rx="12" class="card" /><rect x="0" y="30" width="152" height="500" rx="12" fill="var(--sidebar)"/><rect x="138" y="30" width="14" height="500" rx="0" fill="var(--sidebar)"/><text x="20" y="64" class="bb" text-anchor="start" style="fill:#ffffff">UniQCAI</text><text x="20" y="80" class="sm" text-anchor="start" style="fill:#97a2af">by Digital Upshot</text><text x="22" y="124" class="" text-anchor="start" style="fill:#97a2af">Overview</text><rect x="8" y="138" width="130" height="28" rx="6" fill="#262c35"/><rect x="8" y="138" width="3" height="28" rx="2" fill="#3d5ce8"/><text x="22" y="156" class="b" text-anchor="start" style="fill:#ffffff">Brands</text><text x="22" y="188" class="" text-anchor="start" style="fill:#97a2af">Runs</text><text x="22" y="220" class="" text-anchor="start" style="fill:#97a2af">Schedules</text><text x="22" y="252" class="" text-anchor="start" style="fill:#97a2af">Report library</text><text x="20" y="280" class="sm" text-anchor="start" style="fill:#6b7684">Setup</text><text x="22" y="310" class="" text-anchor="start" style="fill:#97a2af">Platform accounts</text><text x="22" y="342" class="" text-anchor="start" style="fill:#97a2af">Mailboxes</text><text x="22" y="374" class="" text-anchor="start" style="fill:#97a2af">Users &amp; access</text><text x="22" y="406" class="" text-anchor="start" style="fill:#97a2af">Settings</text><text x="22" y="438" class="" text-anchor="start" style="fill:#97a2af">Audit log</text><text x="176" y="68" class="h1" text-anchor="start">Connect a platform</text><line x1="152" y1="102" x2="960" y2="102" class="sep" /><circle cx="187" cy="137" r="11" fill="var(--ok)"/><path d="M183 138 l2.6 2.8 L191.5 134" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="142" class="sm" text-anchor="start" style="fill:var(--text)">Platform &amp; categories</text><line x1="330" y1="137" x2="350" y2="137" class="sep" stroke="var(--line2)"/><circle cx="371" cy="137" r="11" fill="var(--ok)"/><path d="M367 138 l2.6 2.8 L375.5 134" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="142" class="sm" text-anchor="start" style="fill:var(--text)">Login</text><line x1="409" y1="137" x2="429" y2="137" class="sep" stroke="var(--line2)"/><circle cx="450" cy="137" r="11" fill="var(--ok)"/><path d="M446 138 l2.6 2.8 L454.5 134" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="469" y="142" class="sm" text-anchor="start" style="fill:var(--text)">Verification</text><line x1="534" y1="137" x2="554" y2="137" class="sep" stroke="var(--line2)"/><circle cx="575" cy="137" r="11" fill="var(--primary)"/><text x="575" y="142" class="sm b" text-anchor="middle" style="fill:#ffffff">4</text><text x="594" y="142" class="sm b" text-anchor="start" style="fill:var(--text)">Reports &amp; test</text><text x="176" y="188" class="h2" text-anchor="start">Reports to collect by default</text><rect x="176" y="204" width="360" height="150" rx="8" class="card" /><text x="192" y="228" class="sm b" text-anchor="start">Blinkit · Ads</text><rect x="192" y="240" width="15" height="15" rx="4" class="card" style="fill:var(--primary)"/><path d="M195.5 248 l2.6 2.8 L204.0 244" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="252" class="sm" text-anchor="start" style="fill:var(--text)">MTD search report</text><rect x="192" y="268" width="15" height="15" rx="4" class="card" style="fill:var(--primary)"/><path d="M195.5 276 l2.6 2.8 L204.0 272" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="280" class="sm" text-anchor="start" style="fill:var(--text)">Dashboard export</text><text x="192" y="318" class="sm b" text-anchor="start">Blinkit · Sales</text><rect x="192" y="330" width="15" height="15" rx="4" class="card" style="fill:var(--bg)"/><text x="216" y="342" class="sm" text-anchor="start" style="fill:var(--dim)">Seller reports — to be confirmed</text><rect x="552" y="204" width="384" height="150" rx="8" class="sub" /><text x="568" y="228" class="b" text-anchor="start">Test sign-in</text><path d="M570 246 l2.6 2.8 L578.5 242" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="250" class="sm" text-anchor="start" style="fill:var(--text)">Browser started</text><text x="920" y="250" class="mono" text-anchor="end">0:02</text><path d="M570 263 l2.6 2.8 L578.5 259" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="267" class="sm" text-anchor="start" style="fill:var(--text)">Opened the Blinkit sign-in page</text><text x="920" y="267" class="mono" text-anchor="end">0:05</text><path d="M570 280 l2.6 2.8 L578.5 276" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="284" class="sm" text-anchor="start" style="fill:var(--text)">Login entered</text><text x="920" y="284" class="mono" text-anchor="end">0:07</text><g stroke="var(--otp)" stroke-width="1.5" fill="none"><rect x="568" y="292.5" width="12" height="9" rx="1.5"/><path d="M568 293.5 l6 4 l6 -4"/></g><text x="590" y="301" class="sm" text-anchor="start" style="fill:var(--text)">Waiting for the code in reports-inbox…</text><text x="920" y="301" class="mono" text-anchor="end">0:19</text><circle cx="574" cy="314" r="4.5" fill="none" stroke="var(--dim)" stroke-width="1.5"/><text x="590" y="318" class="sm" text-anchor="start" style="fill:var(--muted)">Signed in</text><circle cx="574" cy="331" r="4.5" fill="none" stroke="var(--dim)" stroke-width="1.5"/><text x="590" y="335" class="sm" text-anchor="start" style="fill:var(--muted)">Business confirmed</text><text x="176" y="378" class="sm" text-anchor="start">Saving is enabled once the test passes. You may save without testing — the login is then marked Untested.</text><rect x="786" y="406" width="150" height="28" rx="8" fill="var(--primary)"/><text x="861.0" y="424" class="sm b" text-anchor="middle" style="fill:#ffffff">Save connection</text>
</svg>
