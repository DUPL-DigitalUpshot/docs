<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-label="Platform, category and report type; brands, logins and connections">
<title>Platform, category and report type; brands, logins and connections</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="1040" height="330" fill="var(--app)"/>
<text x="18" y="30" class="h2" text-anchor="start">How everything is named</text><rect x="18" y="46" width="470" height="262" rx="8" class="card" /><text x="38" y="74" class="b" text-anchor="start">What you pick when you ask for reports</text><text x="38" y="94" class="sm" text-anchor="start">Every screen groups the same way.</text><text x="38" y="124" class="sm b" text-anchor="start">Platform</text><text x="152" y="124" class="sm b" text-anchor="start">Category</text><text x="254" y="124" class="sm b" text-anchor="start">Report types</text><rect x="38" y="136" width="74" height="22" rx="11" fill="var(--panel)"/><circle cx="49" cy="147" r="4" fill="#f5c518"/><text x="59" y="151" class="sm" text-anchor="start" style="fill:var(--text)">Blinkit</text><path d="M116 147 L148 147" class="arw" marker-end="url(#a)"/><rect x="152" y="136" width="52" height="22" rx="11" fill="var(--panel)"/><text x="178" y="151" class="sm b" text-anchor="middle">Ads</text><rect x="152" y="168" width="52" height="22" rx="11" fill="var(--panel)"/><text x="178" y="183" class="sm b" text-anchor="middle">Sales</text><path d="M208 147 L248 147" class="arw" marker-end="url(#a)"/><path d="M208 181 L248 181" class="arw" marker-end="url(#a)"/><text x="254" y="149" class="sm" text-anchor="start">• MTD search report</text><text x="254" y="168" class="sm" text-anchor="start">• Dashboard export</text><text x="254" y="187" class="sm" text-anchor="start">• To be confirmed with you</text><text x="38" y="226" class="sm" text-anchor="start">You never have to know that Blinkit · Sales is really a site called</text><text x="38" y="246" class="sm" text-anchor="start">PartnersBiz. Site names appear only in setup details and in error</text><text x="38" y="266" class="sm" text-anchor="start">messages, where they help support work out what broke.</text><rect x="506" y="46" width="516" height="262" rx="8" class="card" /><text x="526" y="74" class="b" text-anchor="start">How a brand is joined to a login</text><text x="526" y="94" class="sm" text-anchor="start">A login is not owned by a brand. It is connected to one.</text><text x="674" y="126" class="sm" text-anchor="middle">connection</text><rect x="526" y="134" width="138" height="56" rx="8" class="sub" /><text x="538" y="156" class="sm" text-anchor="start">Brand</text><text x="538" y="176" class="b" text-anchor="start">Northwind Foods</text><path d="M668 162 L694 162" class="arw" marker-end="url(#a)"/><rect x="698" y="134" width="158" height="56" rx="8" class="sub" /><text x="710" y="156" class="sm" text-anchor="start">Platform login</text><text x="710" y="176" class="sm" text-anchor="start">one email + password</text><rect x="894" y="124" width="118" height="36" rx="8" class="sub" /><text x="906" y="146" class="sm" text-anchor="start">Ads reports</text><rect x="894" y="170" width="118" height="36" rx="8" class="sub" /><text x="906" y="192" class="sm" text-anchor="start">Sales reports</text><path d="M860 162 h16 v-20 h14" class="arw" marker-end="url(#a)"/><path d="M860 162 h16 v26 h14" class="arw" marker-end="url(#a)"/><text x="526" y="226" class="sm b" text-anchor="start">Two things follow, and both are deliberate:</text><text x="526" y="248" class="sm" text-anchor="start">•  One login can serve several brands — an agency login is normal.</text><text x="526" y="268" class="sm" text-anchor="start">•  One login can serve both Ads and Sales, so you enter it once.</text><text x="526" y="292" class="sm" text-anchor="start">Because of the first, every connection records which business it expects.</text>
</svg>
