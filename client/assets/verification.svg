<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-label="How a one-time sign-in code reaches UniQCAI safely">
<title>How a one-time sign-in code reaches UniQCAI safely</title>
<style>
svg{
 --bg:#ffffff;--app:#fafbfc;--panel:#f4f6f8;--line:#dde2e8;--line2:#c4ccd5;
 --text:#171b21;--muted:#4f5967;--primary:#2a45cc;--soft:#eef3ff;--sidebar:#0d1014;
 --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
 --info:#0369a1;--infobg:#e0f2fe;--otp:#7c3aed;--otpbg:#ede9fe;--dim:#97a2af;--dash:#c4ccd5;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#171b21;--app:#0d1014;--panel:#262c35;--line:#262c35;--line2:#3a424e;
 --text:#f4f6f8;--muted:#97a2af;--primary:#3d5ce8;--soft:#1d2c69;--sidebar:#080a0d;
 --ok:#4ade80;--okbg:#052e16;--warn:#fbbf24;--warnbg:#451a03;--bad:#f87171;--badbg:#450a0a;
 --info:#38bdf8;--infobg:#082f49;--otp:#a78bfa;--otpbg:#2e1065;--dim:#97a2af;--dash:#3a424e;
}}
text{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;fill:var(--text)}
.sm{font-size:12.5px;fill:var(--muted)}
.sms{font-size:12.5px;fill:var(--text)}
.h1{font-size:22px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.b{font-weight:500}
.bb{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1}
.sub{fill:var(--panel);stroke:var(--line);stroke-width:1}
.soft{fill:var(--soft);stroke:none}
.arw{stroke:var(--line2);fill:none;stroke-width:1.5}
.sep{stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
 markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line2)"/></marker></defs>
<rect width="1040" height="330" fill="var(--app)"/>
<text x="18" y="30" class="h2" text-anchor="start">How UniQCAI gets past a sign-in code</text><text x="18" y="50" class="sm" text-anchor="start">Most of these portals email a code or a sign-in link instead of accepting a password alone.</text><rect x="18" y="74" width="224" height="104" rx="8" class="card" /><text x="34" y="104" class="b" text-anchor="start">UniQCAI</text><text x="34" y="130" class="sm" text-anchor="start">Opens the portal and</text><text x="34" y="148" class="sm" text-anchor="start">enters the login.</text><rect x="278" y="74" width="224" height="104" rx="8" class="card" /><text x="294" y="104" class="b" text-anchor="start">The portal</text><text x="294" y="130" class="sm" text-anchor="start">Emails a code or a</text><text x="294" y="148" class="sm" text-anchor="start">one-time sign-in link.</text><rect x="538" y="74" width="224" height="104" rx="8" class="card" /><text x="554" y="104" class="b" text-anchor="start">Your verification inbox</text><text x="554" y="130" class="sm" text-anchor="start">An inbox you nominate.</text><text x="554" y="148" class="sm" text-anchor="start">Nothing else uses it.</text><rect x="798" y="74" width="224" height="104" rx="8" class="card" /><text x="814" y="104" class="b" text-anchor="start">UniQCAI</text><text x="814" y="130" class="sm" text-anchor="start">Reads only the matching</text><text x="814" y="148" class="sm" text-anchor="start">message, and signs in.</text><path d="M244 126 L276 126" class="arw" marker-end="url(#a)"/><path d="M504 126 L536 126" class="arw" marker-end="url(#a)"/><path d="M764 126 L796 126" class="arw" marker-end="url(#a)"/><g stroke="var(--otp)" stroke-width="1.5" fill="none"><rect x="726" y="95.5" width="12" height="9" rx="1.5"/><path d="M726 96.5 l6 4 l6 -4"/></g><rect x="18" y="202" width="1004" height="112" rx="8" class="sub" /><text x="38" y="230" class="b" text-anchor="start">Four rules stop it ever reading the wrong message</text><text x="38" y="258" class="sm b" text-anchor="start">Time</text><text x="38" y="280" class="sm" text-anchor="start">only messages that arrived</text><text x="38" y="298" class="sm" text-anchor="start">after we asked for one.</text><text x="286" y="258" class="sm b" text-anchor="start">Sender and subject</text><text x="286" y="280" class="sm" text-anchor="start">must match the rule you can</text><text x="286" y="298" class="sm" text-anchor="start">see and test on screen.</text><text x="534" y="258" class="sm b" text-anchor="start">Addressed to us</text><text x="534" y="280" class="sm" text-anchor="start">on a shared or forwarded inbox,</text><text x="534" y="298" class="sm" text-anchor="start">the code must be for this login.</text><text x="782" y="258" class="sm b" text-anchor="start">One at a time</text><text x="782" y="280" class="sm" text-anchor="start">two sign-ins on the same inbox</text><text x="782" y="298" class="sm" text-anchor="start">never overlap.</text>
</svg>
